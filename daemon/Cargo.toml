[package]
name = "naru-d"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
libc = "0.2.191"
libproc = "0.15.0"
portable-pty = "0.9.0"
rand = "0.9.5"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shell-words = "1.1.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
vte = "0.15.0"
